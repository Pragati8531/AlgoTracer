<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>🧭 AlgoTracer – Pathfinding Visualizer</title>
    <meta
      name="description"
      content="AlgoTracer is a visual learning tool that demonstrates pathfinding algorithms like BFS, DFS, Dijkstra, A*, and GBFS with real-time grid animations."
    />

    <!-- Modern font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon (optional small logo) -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2940/2940673.png" />

    <!-- Global background + theme -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(circle at top, #0a192f 0%, #010b18 100%);
        color: #e0e7ff;
        min-height: 100vh;
        overflow-x: hidden;
        transition: background 0.5s ease;
      }

      ::selection {
        background: #00d1ff;
        color: #000;
      }

      #root {
        animation: fadeIn 0.8s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
